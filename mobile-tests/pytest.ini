[pytest]
# --timeout=150 (signal-based, so it interrupts a genuinely hung raw call
# even when our own client-socket timeout / _recovering() wrapper doesn't
# catch it) is a hard backstop mirrored from KrishiIQ's pytest.ini, added
# after CI logs showed the login_register_link tap wedge surviving both of
# those layers on nearly every fresh Appium session. See utils/appium_connection.py
# and page_objects/base_page.py for the other two layers of the same defense.
addopts = -v --timeout=150 --timeout-method=signal --reruns 1 --reruns-delay 2 --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: fast, high-value subset safe to run on every push
    auth: authentication / session flows
    registration: registration and onboarding flows
    navigation: bottom-nav and inter-screen navigation
    dashboard: dashboard screen
    health_assessment: 4-step health assessment flow
    recommendations: meal recommendation screen
    meal_plan: weekly meal plan screen
    progress: progress logging (CRUD)
    chat: AI coach chat screen
    profile: profile / settings / security tabs
    validation: input validation and boundary cases
    error_handling: network-failure / backend-error paths
    accessibility: semantic labels, tap targets, text scaling
    responsiveness: rotation and layout adaptation
    session_mgmt: token persistence, forced logout, app-restart behaviour
    slow: tests that are individually expensive (network toggling, restarts)