name: FitFuel Web - Selenium Test Suite

# Runs entirely inside GitHub Actions, in a single job. Nothing here
# requires (or expects) a local machine: the web app is built and served by
# `vite preview` inside the runner, Chrome is installed on the runner with
# Selenium Manager left to resolve a matching chromedriver against it,
# pytest-xdist parallelizes across CPU cores within this one job, and every
# report/artifact is produced and uploaded by the workflow itself.
#
# Fixes baked in after real CI runs, in the order they were found:
#
# 1. chromedriver/Chrome version mismatch (found via widespread
#    TimeoutExceptions - 92% of all failures in that run shared this exact
#    symptom, even on completely standard, unauthenticated pages).
#    ubuntu-latest ships a pre-installed /usr/bin/chromedriver that Selenium
#    Manager can end up preferring over a correctly matched one. First fix
#    attempt used browser-actions/setup-chrome's `install-chromedriver:
#    true` to install a "matched" pair - this INTRODUCED A NEW BUG (see #3).
#
# 2. Broken 4-way matrix sharding. Execution was split across 4 matrix jobs
#    using pytest-split, which turned out to silently not partition
#    anything - each contributing shard ran the FULL suite, and only 2 of 4
#    shards even contributed data, inflating the reported total to 2210+
#    "attempts" even though there are only 525 real, unique tests. Fixed by
#    removing the matrix + pytest-split + merge-reports job entirely. This
#    workflow now runs pytest exactly ONCE, in ONE job, using `-n 4`
#    (pytest-xdist, pinned rather than "auto" for predictable resource
#    usage) purely for in-process parallelism. Combined with conftest.py's
#    final-status-only result capture (reruns are absorbed into a test's
#    final outcome, never reported as separate rows), every report this
#    workflow produces shows exactly 525 rows for the full suite.
#
# 3. `install-chromedriver: true` (from fix #1) is itself a known, currently
#    open bug in browser-actions/setup-chrome
#    (browser-actions/setup-chrome#619): the Chrome build and the bundled
#    chromedriver build can resolve to DIFFERENT, mismatched versions
#    independently of each other, which is a different bug that produces the
#    same class of symptom - except worse, because it now fails 100% of
#    tests immediately at browser-launch time with a hard
#    `session not created: This version of ChromeDriver only supports
#    Chrome version X` error (525 failed / 0 passed, ~206s total - every
#    test dying at driver setup, never even reaching a page). Fixed by
#    dropping `install-chromedriver: true` entirely and going back to
#    Selenium Manager (bundled with Selenium 4.6+), which is specifically
#    designed for this: given an explicit `binary_location` (CHROME_PATH,
#    wired into utils/driver_factory.py), it inspects THAT exact Chrome
#    binary's real version and downloads a matching driver from the
#    official Chrome for Testing endpoint at runtime, rather than trusting a
#    separate action output that may not actually correspond to it. Step 1's
#    PATH cleanup (removing /usr/bin/chromedriver) is still required and
#    kept - that part of fix #1 was correct, only the "also bundle a
#    chromedriver via the action" part was the mistake.
#
# 4. Wrong router assumption. This suite originally assumed the app used
#    React Router's BrowserRouter; it actually uses HashRouter
#    (web/src/main.tsx). Every route must be addressed as BASE_URL + '#/...'
#    - see config.py#route_url() and its docstring for the full story. This
#    was the root cause of nearly every navigation-dependent test failure
#    across every prior run, independent of the chromedriver issues above.
#
# See selenium-tests/config.py for why the app is built WITHOUT a live
# backend on purpose (VITE_API_BASE_URL is left unset, so it falls back to
# the app's own dead-by-default http://localhost:4000 - see
# web/src/api/client.ts). That keeps this pipeline green and safe on every
# push without ever touching the real Render production database, while
# still exercising every real UI path via the suite's two-tier auth
# fallback (real login attempt -> token injection).

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "selenium-tests/**"
      - ".github/workflows/selenium-tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "web/**"
      - "selenium-tests/**"
      - ".github/workflows/selenium-tests.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override BASE_URL (e.g. the real deployed GitHub Pages URL for a production smoke run)"
        required: false
        default: ""
      reruns:
        description: "Automatic reruns per failed test, absorbed into that test's final status (0 to disable)"
        required: false
        default: "2"
      headless:
        description: "Run Chrome headless"
        required: false
        default: "true"

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  selenium-tests:
    name: Build, run 525 Selenium tests, generate reports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build (VITE_API_BASE_URL intentionally left unset)
        working-directory: web
        run: npm run build

      - name: Serve the built app with vite preview
        working-directory: web
        run: |
          nohup npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &
          echo $! > ../preview.pid

      - name: Wait for preview server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/fitfuel-final/login >/dev/null; then
              echo "Preview server is up."
              exit 0
            fi
            echo "Waiting for preview server ($i/30)..."
            sleep 2
          done
          echo "Preview server never became ready."
          cat preview.log || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: selenium-tests/requirements.txt

      - name: Install Python test dependencies
        working-directory: selenium-tests
        run: pip install -r requirements.txt

      - name: Remove any pre-installed chromedriver from PATH
        # Critical, not just defensive: ubuntu-latest ships a pre-installed
        # /usr/bin/chromedriver that Selenium Manager can end up preferring
        # over a correctly-resolved one, causing "session not created:
        # This version of ChromeDriver only supports Chrome version X"
        # errors that fail 100% of tests at browser-launch time. Must run
        # BEFORE Selenium Manager ever gets a chance to see it.
        run: sudo rm -f /usr/bin/chromedriver /usr/local/bin/chromedriver || true

      - name: Install Chrome
        # Only Chrome itself, deliberately WITHOUT install-chromedriver.
        # browser-actions/setup-chrome's `install-chromedriver: true` has a
        # known, currently-open bug (browser-actions/setup-chrome#619) where
        # the Chrome build and the bundled chromedriver build can resolve to
        # mismatched versions independently, producing the exact
        # "session not created: This version of ChromeDriver only supports
        # Chrome version X" failure this suite hit when that flag was used.
        # Selenium Manager (bundled with Selenium 4.6+) is a more reliable
        # fix: given an explicit binary_location (CHROME_PATH, wired below),
        # it inspects THAT exact Chrome binary's real version and downloads
        # a matching driver from the official Chrome for Testing endpoint at
        # runtime - no separate, independently-versioned action output to
        # trust.
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Run the 525-test Selenium suite
        working-directory: selenium-tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          HEADLESS: ${{ github.event.inputs.headless || 'true' }}
          BASE_URL: ${{ github.event.inputs.base_url || '' }}
          SELENIUM_TIMEOUT: "15"
        run: |
          mkdir -p reports/screenshots reports/logs reports/results
          echo "Chrome: $CHROME_PATH"
          "$CHROME_PATH" --version
          pytest \
            -n 4 \
            --reruns "${{ github.event.inputs.reruns || 2 }}" \
            --reruns-delay 2 \
            -v \
            tests/
        continue-on-error: true

      - name: Generate Excel / HTML / dashboard / summary reports
        working-directory: selenium-tests
        env:
          PASS_RATE_GATE: "90"
        run: python3 generate_reports.py

      - name: Post summary to job log
        if: always()
        working-directory: selenium-tests
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Stop preview server
        if: always()
        run: kill "$(cat preview.pid)" 2>/dev/null || true

      - name: Upload report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            selenium-tests/reports/execution-results.json
            selenium-tests/reports/Automation_Test_Report.xlsx
            selenium-tests/reports/execution-report.html
            selenium-tests/reports/dashboard.html
            selenium-tests/reports/summary.md
            selenium-tests/reports/screenshots/**
            selenium-tests/reports/logs/**
          retention-days: 30
