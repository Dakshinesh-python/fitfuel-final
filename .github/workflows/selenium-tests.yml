name: FitFuel Web - Selenium Test Suite

# Runs entirely inside GitHub Actions, in a single job. Nothing here
# requires (or expects) a local machine: the web app is built and served by
# `vite preview` inside the runner, Chrome + a VERSION-MATCHED chromedriver
# are installed on the runner, pytest-xdist parallelizes across CPU cores
# within this one job, and every report/artifact is produced and uploaded
# by the workflow itself.
#
# Two fixes baked in after the suite's first real CI run:
#
# 1. chromedriver/Chrome version mismatch. ubuntu-latest ships a
#    pre-installed /usr/bin/chromedriver that can be a different version
#    than whatever Chrome gets installed alongside it. Selenium Manager can
#    end up preferring that stale binary, which caused widespread flaky
#    TimeoutExceptions across nearly the whole suite in the first run (92%
#    of all failures shared this exact symptom). Fixed by installing Chrome
#    AND a version-matched chromedriver together via
#    browser-actions/setup-chrome's `install-chromedriver: true`, and wiring
#    the matched driver path explicitly into Selenium
#    (selenium-tests/utils/driver_factory.py) so there's no ambiguity.
#
# 2. Broken 4-way matrix sharding. The previous version of this workflow
#    split execution across 4 matrix jobs using pytest-split, which turned
#    out to silently not partition anything - each contributing shard ran
#    the FULL suite, and only 2 of 4 shards even contributed data, inflating
#    the reported total to 2210+ "attempts" even though there are only 525
#    real, unique tests. That whole matrix + pytest-split + merge-reports
#    job has been removed. This workflow now runs pytest exactly ONCE, in
#    ONE job, using `-n auto` (pytest-xdist) purely for in-process
#    parallelism across CPU cores. Combined with conftest.py's final-status
#    -only result capture (reruns are absorbed into a test's final outcome,
#    never reported as separate rows), every report this workflow produces
#    shows exactly 525 rows for the full suite - no duplication, no "RERUN"
#    status anywhere.
#
# See selenium-tests/config.py for why the app is built WITHOUT a live
# backend on purpose (VITE_API_BASE_URL is left unset, so it falls back to
# the app's own dead-by-default http://localhost:4000 - see
# web/src/api/client.ts). That keeps this pipeline green and safe on every
# push without ever touching the real Render production database, while
# still exercising every real UI path via the suite's two-tier auth
# fallback (real login attempt -> token injection).

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "selenium-tests/**"
      - ".github/workflows/selenium-tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "web/**"
      - "selenium-tests/**"
      - ".github/workflows/selenium-tests.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override BASE_URL (e.g. the real deployed GitHub Pages URL for a production smoke run)"
        required: false
        default: ""
      reruns:
        description: "Automatic reruns per failed test, absorbed into that test's final status (0 to disable)"
        required: false
        default: "2"
      headless:
        description: "Run Chrome headless"
        required: false
        default: "true"

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  selenium-tests:
    name: Build, run 525 Selenium tests, generate reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build (VITE_API_BASE_URL intentionally left unset)
        working-directory: web
        run: npm run build

      - name: Serve the built app with vite preview
        working-directory: web
        run: |
          nohup npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &
          echo $! > ../preview.pid

      - name: Wait for preview server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/fitfuel-final/login >/dev/null; then
              echo "Preview server is up."
              exit 0
            fi
            echo "Waiting for preview server ($i/30)..."
            sleep 2
          done
          echo "Preview server never became ready."
          cat preview.log || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: selenium-tests/requirements.txt

      - name: Install Python test dependencies
        working-directory: selenium-tests
        run: pip install -r requirements.txt

      - name: Remove any pre-installed chromedriver from PATH
        # Defensive: ensures nothing on this runner can shadow the
        # version-matched driver installed below, even if
        # CHROMEDRIVER_PATH were ever unset.
        run: sudo rm -f /usr/bin/chromedriver /usr/local/bin/chromedriver || true

      - name: Install Chrome + matching ChromeDriver
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Run the 525-test Selenium suite
        working-directory: selenium-tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          HEADLESS: ${{ github.event.inputs.headless || 'true' }}
          BASE_URL: ${{ github.event.inputs.base_url || '' }}
          SELENIUM_TIMEOUT: "15"
        run: |
          mkdir -p reports/screenshots reports/logs reports/results
          echo "Chrome: $CHROME_PATH"
          echo "ChromeDriver: $CHROMEDRIVER_PATH"
          pytest \
            -n auto \
            --reruns "${{ github.event.inputs.reruns || 2 }}" \
            --reruns-delay 2 \
            -v \
            tests/
        continue-on-error: true

      - name: Generate Excel / HTML / dashboard / summary reports
        working-directory: selenium-tests
        env:
          PASS_RATE_GATE: "90"
        run: python3 generate_reports.py

      - name: Post summary to job log
        if: always()
        working-directory: selenium-tests
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Stop preview server
        if: always()
        run: kill "$(cat preview.pid)" 2>/dev/null || true

      - name: Upload report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            selenium-tests/reports/execution-results.json
            selenium-tests/reports/Automation_Test_Report.xlsx
            selenium-tests/reports/execution-report.html
            selenium-tests/reports/dashboard.html
            selenium-tests/reports/summary.md
            selenium-tests/reports/screenshots/**
            selenium-tests/reports/logs/**
          retention-days: 30
