name: Android E2E (Appium)

# Restructured from a single ~180min job into build-once + 4-way sharded
# test matrix + merge, mirroring the KrishiIQ reference project's
# android-e2e.yml. Unlike KrishiIQ, this app needs a real Postgres-backed
# Node backend (see backend-tests.yml's pattern) rather than a static
# hosted one, so each shard still runs its own full backend setup
# (services: postgres is job-scoped, can't be shared across jobs) --
# only the Flutter APK build itself is hoisted into a single shared job,
# since it's the one piece that's genuinely identical across all 4
# shards and doesn't depend on a live database.
on:
  push:
    branches: [main]
    paths:
      - "fitfuel_mobile/**"
      - "backend/**"
      - "mobile-tests/**"
      - ".github/workflows/android-e2e.yml"
  pull_request:
    paths:
      - "fitfuel_mobile/**"
      - "backend/**"
      - "mobile-tests/**"
  workflow_dispatch: {}

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  # NOTE (see mobile-tests/README.md -> "The 90-vs-95 drift"): this is
  # the ONE place the gate threshold is defined. mobile-tests/config.py
  # reads it too (falls back to 90 if unset) so the CI summary and the
  # actual pytest exit code can never silently disagree the way the
  # reference project's did.
  GATE_THRESHOLD_PCT: "90"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: fitfuel_mobile
        run: flutter pub get

      - name: Build flutter-driver-enabled debug APK
        working-directory: fitfuel_mobile
        run: |
          flutter build apk --debug -t lib/main_test.dart \
            --dart-define=API_BASE_URL=http://10.0.2.2:4000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: fitfuel_mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1

  android-e2e:
    needs: build-apk
    runs-on: ubuntu-latest
    # Was 180 for the whole (unsharded) suite in one job, then cut to 75
    # on the assumption each shard's ~100 tests would run in a couple of
    # seconds each. That assumption broke: fitfuel_mobile/lib/services/
    # api_config.dart had a hardcoded API base URL instead of reading the
    # API_BASE_URL dart-define, so every CI build silently called the
    # live production backend (network latency + Render cold-start)
    # instead of localhost, making each test take ~45-50s instead of a
    # few seconds -- 75min was only enough to get through ~90 tests
    # before the whole matrix (all 4 shards start within the same
    # second) got killed simultaneously at the 75min mark, which is why
    # some shards never got past their first assigned test file. Now
    # that api_config.dart actually honors API_BASE_URL, shards should
    # again finish in well under this, but 130 keeps real headroom
    # without masking a genuinely wedged session (see mobile-tests/
    # README.md's notes on Appium/Flutter-Driver's single serial command
    # queue: one hung command can block every test after it for the rest
    # of the session, so a shard that's actually stuck should still fail
    # on this timeout rather than eating an unbounded budget).
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            test_files: >-
              tests/test_02_registration.py
              tests/test_04_navigation.py
              tests/test_17_extended_matrices.py
              tests/test_14_accessibility.py
              tests/test_15_responsiveness.py
          - shard: 2
            test_files: >-
              tests/test_03_health_assessment.py
              tests/test_08_progress_crud.py
              tests/test_07_meal_plan.py
              tests/test_16_form_field_matrices.py
          - shard: 3
            test_files: >-
              tests/test_09_chat.py
              tests/test_01_authentication.py
              tests/test_19_additional_coverage.py
              tests/test_06_recommendations.py
              tests/test_13_session_management.py
          - shard: 4
            test_files: >-
              tests/test_00_ui_chrome.py
              tests/test_10_profile_settings.py
              tests/test_11_input_validation.py
              tests/test_05_dashboard.py
              tests/test_18_integration_regression.py
              tests/test_12_error_handling.py
    # This file-to-shard split was balanced by actual/estimated
    # parametrized test count (test_02/03 alone are ~47 tests each), not
    # just file count, aiming for ~100 tests/shard out of ~402 total. If
    # a future test file is added or a file's parametrize list grows a
    # lot, rebalance using the counts in mobile-tests/reports/summary.md
    # from a real run rather than guessing from def-count.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitfuel
          POSTGRES_PASSWORD: fitfuel
          POSTGRES_DB: fitfuel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt APK
        uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: fitfuel_mobile/build/app/outputs/flutter-apk/

      # ── backend (real Postgres, real migrations, real seed data --
      #    same pattern backend-tests.yml already uses). Can't be hoisted
      #    into build-apk since `services:` containers are job-scoped and
      #    each shard needs its own live, isolated Postgres instance. ──
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://fitfuel:fitfuel@localhost:5432/fitfuel_ci

      - name: Seed meal catalog
        working-directory: backend
        run: npm run prisma:seed
        env:
          DATABASE_URL: postgresql://fitfuel:fitfuel@localhost:5432/fitfuel_ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: npm run start &
        env:
          DATABASE_URL: postgresql://fitfuel:fitfuel@localhost:5432/fitfuel_ci
          PORT: "4000"

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          exit 1

      # ── Android emulator + Appium server ─────────────────────────────
      - name: Enable KVM (required for a usable emulator on Actions runners)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium + Flutter driver
        run: |
          # Pin the full Appium 2.x stack. The latest uiautomator2 (8.x)
          # requires Appium 3.x, but appium-flutter-driver 2.x requires
          # Appium 2.x -- they cannot coexist on different major server
          # versions. This pinned triple is the last known-good 2.x set.
          npm install -g appium@2.19.0
          appium driver install uiautomator2@4.2.9
          appium driver install --source=npm appium-flutter-driver@2.0.0

      - name: Run Android emulator + tests (shard ${{ matrix.shard }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: test
          disable-animations: true
          script: |
            pip install -r mobile-tests/requirements.txt
            # Start Appium inside the emulator-runner script so it launches
            # after the emulator is online and ADB is responsive.
            appium --base-path / &
            sleep 8
            # Install the test APK.
            adb install -r fitfuel_mobile/build/app/outputs/flutter-apk/app-debug.apk
            # Pre-warm Flutter's Impeller GPU backend so the first Appium
            # session doesn't land on a mid-init Dart isolate that gets
            # immediately destroyed (causing every waitFor to return Error:{}).
            adb shell monkey -p com.example.fitfuel_mobile -c android.intent.category.LAUNCHER 1 || true
            sleep 12
            adb shell am force-stop com.example.fitfuel_mobile || true
            sleep 2
            cd mobile-tests && python3 -m pytest -m "not slow" --tb=short ${{ matrix.test_files }}
        env:
          APK_PATH: ${{ github.workspace }}/fitfuel_mobile/build/app/outputs/flutter-apk/app-debug.apk
          GATE_THRESHOLD_PCT: ${{ env.GATE_THRESHOLD_PCT }}
          SESSION_CREATION_TIMEOUT: "120"
          # Each shard writes to its own subdirectory so the 4 artifacts
          # never collide with each other when downloaded together by
          # merge-reports.
          REPORTS_DIR: reports/shard-${{ matrix.shard }}

      - name: Sanitize log filenames
        if: always()
        run: |
          # Rename log files that contain characters invalid for artifact upload
          # (<, >, :, ", |, *, ?) -- these come from XSS/injection test parameter names
          find "mobile-tests/reports/shard-${{ matrix.shard }}/logs" -type f 2>/dev/null | while IFS= read -r f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            safe=$(echo "$base" | sed 's/[<>:"|*?]/_/g')
            if [ "$base" != "$safe" ]; then
              mv "$f" "$dir/$safe"
            fi
          done

      - name: Upload shard ${{ matrix.shard }} raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-results-shard-${{ matrix.shard }}
          path: mobile-tests/reports/shard-${{ matrix.shard }}/
          retention-days: 30

  merge-reports:
    needs: android-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report-generation dependencies
        run: pip install -r mobile-tests/requirements.txt

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: raw-results-shard-*
          path: shard-artifacts

      - name: Merge shard results
        working-directory: mobile-tests
        run: |
          python3 scripts/merge_shard_results.py \
            ../shard-artifacts/raw-results-shard-1 \
            ../shard-artifacts/raw-results-shard-2 \
            ../shard-artifacts/raw-results-shard-3 \
            ../shard-artifacts/raw-results-shard-4 \
            --out reports/execution-results.json
        env:
          GATE_THRESHOLD_PCT: ${{ env.GATE_THRESHOLD_PCT }}

      - name: Generate consolidated reports
        if: always()
        working-directory: mobile-tests
        run: python3 generate_reports.py
        env:
          GATE_THRESHOLD_PCT: ${{ env.GATE_THRESHOLD_PCT }}

      - name: Post summary to job log
        if: always()
        run: |
          if [ -f mobile-tests/reports/summary.md ]; then
            cat mobile-tests/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.md was generated -- see the 'Generate consolidated reports' step's log above for why, and check the uploaded artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload consolidated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-reports
          path: mobile-tests/reports/
          retention-days: 30