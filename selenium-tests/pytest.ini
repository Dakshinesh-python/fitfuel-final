[pytest]
markers =
    authentication: Login / registration flows
    authorization: Route guarding, protected route access, session boundaries
    navigation: Sidebar / header navigation between pages
    ui_validation: Static UI structure, headings, buttons, page chrome
    forms: Form field presence, attributes and submission behavior
    crud: Create / update flows against Progress logs and Profile
    input_validation: Boundary and malformed-input handling in form fields
    error_handling: Error banners, network-failure and invalid-route behavior
    session: Token persistence, logout, cross-tab/localStorage behavior
    downloads: Meal plan regenerate / download actions
    accessibility: Labels, aria attributes, keyboard/contrast basics
    responsive: Viewport breakpoints and mobile layout behavior
    smoke: Fast subset used for quick sanity checks

addopts = -ra --strict-markers
log_cli = false
filterwarnings =
    ignore::DeprecationWarning
